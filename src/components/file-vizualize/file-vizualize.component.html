<div class="file-vizualize">

  <div class="file-vizualize__header">
    <h2>File Vizualizer</h2>
    <div *ngIf="file.length > 0" class="file-vizualize__close" (click)="closeFile()">
      <span>Close file</span>
      <i class="pi pi-times"></i>
    </div>
  </div>

  <div *ngIf="file.length > 0">
    <p-table #dt [value]="file" (sortFunction)="customSort($event)" [customSort]="true">
      <ng-template #header>
        <tr>
          <th pSortableColumn="category">
            Category <p-sortIcon field="category" />
          </th>
          <th pSortableColumn="value">
            Value <p-sortIcon field="value" />
          </th>
        </tr>
      </ng-template>
      <ng-template #body let-fileItem>
        <tr>
          <td>{{ fileItem.category }}</td>
          <td>{{ fileItem.value }}</td>
        </tr>
      </ng-template>
    </p-table>
    <div *ngIf="isSorted == null" class="file-vizualize__controlsTable">
      @if (!isFilter) {
        <div class="file-vizualize__controlsTable_control">
          <span>Hide minimum value</span>
          <i class="pi pi-filter red" (click)="filterMinimalValue()"></i>
        </div>
      } @else {
        <div class="file-vizualize__controlsTable_control">
          <span>Remove filter</span>
          <i class="pi pi-filter-slash green" (click)="resetFilterMinimalValue()"></i>
        </div>
      }
    </div>
  </div>

  @if (file.length > 0) {
    <div class="file-vizualize__charts">
      <app-pie-chart [sortedData]="sortedFile"></app-pie-chart>
    </div>

    <div class="file-vizualize__charts">
      <app-bar-chart [sortedData]="sortedFile"></app-bar-chart>
    </div>
  }
</div>
