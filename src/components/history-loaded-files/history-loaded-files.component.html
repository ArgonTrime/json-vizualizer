<div class="files-list">
  <h2>File History</h2>
  <p>Select a file from the list or upload one to select.</p>
  <ul *ngIf="files" [class]="activeFile ? 'active-file' : ''">
    <li *ngFor="let file of files" (click)="loadFileVizualize(file.file)">
      <i class="pi pi-file"></i>
      {{ file.nameFile }} — {{ file.dateLoad  | date: 'short'}}
    </li>
  </ul>
</div>
